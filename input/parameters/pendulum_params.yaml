# Parameter configuration for Simple Pendulum study

# Physical parameters
physics:
  L: 1.0          # Length (m)
  m: 1.0          # Mass (kg)
  g: 9.80665      # Gravitational acceleration (m/s²)
  damping: 0.0    # Damping coefficient (optional)

# Initial conditions
initial_conditions:
  theta_0: 0.5    # Initial angle (rad)
  omega_0: 0.0    # Initial angular velocity (rad/s)

# Simulation parameters
simulation:
  t_start: 0.0
  t_end: 20.0
  dt: 0.01
  solver: 'RK45'
  tolerance_abs: 1.0e-8
  tolerance_rel: 1.0e-6

# Parameter space exploration (optional)
parameter_sweep:
  enabled: true
  parameter: 'theta_0'
  values: [0.1, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0]

# Alternative: parameter ranges
parameter_ranges:
  L: [0.5, 2.0, 10]     # min, max, num_points
  theta_0: [0.1, 3.0, 20]

# Visualization parameters
visualization:
  show_animation: true
  show_phase_space: true
  show_energy: true
  show_comparison: true
  animation_speed: 1.0  # real-time multiplier
  trail_length: 100     # number of points in trajectory trail

# Output parameters
output:
  save_data: true
  save_plots: true
  save_animation: true
  generate_report: true
  report_format: 'pdf'  # pdf, html, markdown
